name: Process Registration

# Event-sourced registration pipeline.
#
# Architecture:
#   1. User opens an Issue on this repo with title "Register: <username>" and
#      a JSON body containing their repo info (login, repo, pages_url).
#   2. This workflow triggers on issue opening.
#   3. It validates the issue body, verifies the user's repo exists, and
#      rebuilds data/registry.json from ALL registration issues (open + closed
#      with label "registered"). This is idempotent — no conflicts ever.
#   4. It closes the issue with a confirmation comment and labels it "registered".
#   5. The aggregate-federation workflow then picks up the registry change.
#
# Why this design:
#   - NO bot PAT in client code (huge security win)
#   - User opens the issue with their OWN OAuth token (public_repo scope)
#   - Issues are conflict-free (each is independent)
#   - registry.json is always regenerated from sources, never appended to
#   - Full audit trail (every registration is a public issue)
#   - User can see their registration status (issue open = pending, closed = done)

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    # Only run on issues with the "registration" label OR with title starting
    # with "Register:". This prevents the workflow from running on every issue.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'registration') ||
      startsWith(github.event.issue.title, 'Register:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild registry from all registration issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/rebuild_registry.py

      - name: Commit changes
        run: |
          git config user.name "pixelary-bot"
          git config user.email "bot@pixelary.local"
          git add data/registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore: rebuild registry from registration issues [skip ci]"
            git push
          fi

      - name: Close issue with confirmation
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const username = context.payload.issue.user.login;

            // Post a confirmation comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '✅ ثبت‌نام شما پردازش شد.',
                '',
                `کاربر @${username} به رجیستری federated اضافه شد.`,
                '',
                'گالری شما در اجرای بعدی aggregator (حداکثر ۱ ساعت) ظاهر خواهد شد.',
                '',
                '---',
                '_این کامنت به‌صورت خودکار توسط `process-registration.yml` ایجاد شده است._'
              ].join('\n')
            });

            // Add "registered" label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['registered']
              });
            } catch (e) {
              // Label may not exist yet — create it
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'registered',
                  color: '0E8A16',
                  description: 'Registration processed successfully'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['registered']
                });
              } catch (e2) {
                console.log('Could not add label:', e2.message);
              }
            }

            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
