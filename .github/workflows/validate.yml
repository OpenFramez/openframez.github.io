name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate photos.json
        run: |
          python3 -c "
          import json
          with open('data/photos.json') as f:
              data = json.load(f)
          print(f'✓ photos.json is valid JSON')
          print(f'  Total photos: {data[\"total\"]}')
          print(f'  Categories: {len(data[\"categories\"])}')
          assert data['total'] == len(data['photos']), 'total mismatch'
          for p in data['photos']:
              assert 'id' in p, f'missing id in photo'
              assert 'title' in p, f'missing title in {p.get(\"id\")}'
              assert 'thumbnail' in p, f'missing thumbnail in {p.get(\"id\")}'
              assert 'license' in p, f'missing license in {p.get(\"id\")}'
              assert 'author' in p, f'missing author in {p.get(\"id\")}'
          print(f'✓ All photos have required fields')
          "

      - name: Validate videos.json
        run: |
          python3 -c "
          import json
          with open('data/videos.json') as f:
              data = json.load(f)
          print(f'✓ videos.json is valid JSON')
          print(f'  Total videos: {data[\"total\"]}')
          print(f'  Categories: {len(data[\"categories\"])}')
          assert data['total'] == len(data['videos']), 'total mismatch'
          required = ['id', 'title', 'file_url', 'thumb_url', 'duration', 'width', 'height', 'license', 'artist', 'sources']
          for v in data['videos']:
              for key in required:
                  assert key in v, f'missing {key} in video {v.get(\"id\")}'
              assert v['duration'] > 0 and v['duration'] <= 30, f'invalid duration in {v[\"id\"]}: {v[\"duration\"]}'
              assert len(v['sources']) > 0, f'no sources in {v[\"id\"]}'
              for s in v['sources']:
                  assert 'src' in s and 'label' in s, f'bad source in {v[\"id\"]}'
              lic = v['license'].lower()
              normalized = ''.join(c for c in lic if c.isalnum())
              is_free = (
                  'publicdomain' in normalized or
                  normalized.startswith('cc0') or
                  normalized.startswith('ccby') or
                  normalized.startswith('ccbysa') or
                  normalized.startswith('gfdl') or
                  normalized.startswith('pd')
              )
              assert is_free, f'non-free license in {v[\"id\"]}: {v[\"license\"]}'
              assert 'nc' not in lic.lower().replace(' ', ''), f'NC license in {v[\"id\"]}: {v[\"license\"]}'
          print(f'✓ All videos have required fields, valid durations, free licenses, and sources')
          "

      - name: Validate videos_ia.json
        run: |
          python3 -c "
          import json
          with open('data/videos_ia.json') as f:
              data = json.load(f)
          print(f'✓ videos_ia.json is valid JSON')
          print(f'  Total IA videos: {data[\"total\"]}')
          print(f'  Categories: {len(data[\"categories\"])}')
          assert data['total'] == len(data['videos']), 'total mismatch'
          required = ['id', 'title', 'file_url', 'thumb_url', 'duration', 'width', 'height', 'license', 'artist', 'ia_identifier', 'page_url', 'source', 'collection']
          for v in data['videos']:
              for key in required:
                  assert key in v, f'missing {key} in IA video {v.get(\"id\")}'
              assert v['id'].startswith('ia_'), f'bad ID prefix in {v[\"id\"]}'
              assert v['duration'] > 0 and v['duration'] <= 60, f'invalid duration in {v[\"id\"]}: {v[\"duration\"]}'
              assert v['source'] == 'Internet Archive', f'bad source field in {v[\"id\"]}'
              assert v['file_url'].startswith('https://archive.org/download/'), f'bad file_url in {v[\"id\"]}'
              assert v['page_url'].startswith('https://archive.org/details/'), f'bad page_url in {v[\"id\"]}'
              lic = v['license'].lower()
              normalized = ''.join(c for c in lic if c.isalnum())
              is_free = (
                  'publicdomain' in normalized or
                  normalized.startswith('cc0') or
                  normalized.startswith('ccby') or
                  normalized.startswith('ccbysa') or
                  normalized.startswith('gfdl') or
                  normalized.startswith('pd')
              )
              assert is_free, f'non-free license in {v[\"id\"]}: {v[\"license\"]}'
              assert 'nc' not in lic.lower().replace(' ', ''), f'NC license in {v[\"id\"]}: {v[\"license\"]}'
          print(f'✓ All IA videos have required fields, valid durations (<=60s), and free licenses')
          "

      - name: Validate registry.json and federated.json
        run: |
          python3 -c "
          import json
          with open('data/registry.json') as f:
              reg = json.load(f)
          assert 'users' in reg, 'registry missing users field'
          assert isinstance(reg['users'], list), 'users must be a list'
          for u in reg['users']:
              assert 'login' in u, f'registry user missing login: {u}'
              assert 'repo' in u, f'registry user missing repo: {u}'
          print(f'✓ registry.json valid ({len(reg[\"users\"])} users)')

          with open('data/federated.json') as f:
              fed = json.load(f)
          assert 'items' in fed, 'federated missing items field'
          assert isinstance(fed['items'], list), 'items must be a list'
          for item in fed['items']:
              assert 'id' in item, f'federated item missing id'
              assert 'type' in item, f'federated item missing type'
              assert 'source_user' in item, f'federated item missing source_user'
              assert 'file_url' in item, f'federated item missing file_url'
          print(f'✓ federated.json valid ({len(fed[\"items\"])} items)')
          "

      - name: Validate HTML files
        run: |
          for f in index.html videos.html video.html reels.html photo.html about.html upload.html submit.html legal.html 404.html; do
            if [ -f "$f" ]; then
              echo "✓ $f exists"
            else
              echo "✗ $f missing"
              exit 1
            fi
          done

      - name: Validate PWA manifest
        run: |
          python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          assert m['name'], 'missing name'
          assert m['icons'], 'missing icons'
          print(f'✓ manifest.json valid')
          "

      - name: Check for broken internal links
        run: |
          HTML_FILES=$(find . -name "*.html" -not -path "./.git/*")
          for f in $HTML_FILES; do
            grep -oE '(href|src)="\.\/[^"]*"' "$f" | while read -r ref; do
              path=$(echo "$ref" | sed -E 's/.*="\.\/([^"]*)"/\1/')
              if [[ "$path" == *"?"* ]] || [[ "$path" == *"#"* ]] || [[ "$path" == "http"* ]]; then
                continue
              fi
              if [ ! -f "$path" ] && [ ! -f "$(dirname $f)/$path" ]; then
                echo "⚠ Broken link in $f: $path"
              fi
            done
          done
          echo "Link check complete"
