name: Process Submission

# Triggered when a moderator approves a submission issue.
# Reads YAML metadata from the issue body, adds an entry to the appropriate
# data file (photos.json or videos.json), commits, and closes the issue.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process:
    # Only run when the "approved" label is added
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and process submission
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/process_submission.py

      - name: Commit changes
        if: success()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/photos.json data/videos.json 2>/dev/null || true
            git commit -m "feat(content): process submission #${{ github.event.issue.number }}

            Auto-processed from issue #${{ github.event.issue.number }}
            Submitted by: ${{ github.event.issue.user.login }}"
            git push
          else
            echo "No changes to commit"
          fi
